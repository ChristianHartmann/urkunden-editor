appId: de.urkunden-editor.standard
productName: Urkunden-Editor Standard
publish: null
copyright: Copyright © 2026 Christian Hartmann
extraMetadata:
  variant: standard
directories:
  output: dist
  buildResources: build
files:
  - src/**/*
  - templates/**/*
  - assets/**/*
  - variants/standard/**/*
win:
  target: nsis
  icon: build/icon.png
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  shortcutName: Urkunden-Editor Standard
linux:
  target:
    - AppImage
    - deb
  category: Office
  maintainer: Christian Hartmann <kontakt@hartmann-softwareengineering.de>
  icon: build/icon.png
  executableName: urkunden-editor-standard
deb:
  packageName: urkunden-editor-standard
  artifactName: ${productFilename}_${version}_${arch}.${ext}
